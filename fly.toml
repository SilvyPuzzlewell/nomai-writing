app = "nomai-thread-viewer"
primary_region = "iad"

[build]

[env]
  DATABASE_PATH = "/data/threads.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "nomai_data"
  destination = "/data"
